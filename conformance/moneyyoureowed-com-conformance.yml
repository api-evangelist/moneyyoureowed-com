summary: The provider conforms to the two agent protocols it ships — MCP (2025-06-18 revision, Streamable HTTP)
  and A2A 1.0 (JSON-RPC binding) — and to JSON-RPC 2.0 underneath both. It has no REST surface, so the REST-shaped
  standards (OAuth 2.0, OIDC, RFC 9457, JSON:API, pagination, idempotency) are absent rather than failed; oauth2/oidc
  are recorded false because the docs explicitly state no OAuth. No domain-standard signature exists for this market
  (consumer money-recovery education has none), so none is asserted.
