    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
    documentation_url: false
    security_schemes: false
  grade_basis: 'Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming and pushNotifications
    declared as boolean fields. protocolVersion is present (pass) — at the top level as "1.0" AND on supportedInterfaces[0].
    skills is an ARRAY (pass) with one skill carrying id, name, description, tags and examples. Both optional discriminators
    are present: defaultInputModes and defaultOutputModes. preferredTransport is absent because A2A 1.0.0 superseded
    it with supportedInterfaces[].protocolBinding, which the card declares (JSONRPC); its absence is spec-current,
    not a gap. The declared interface was exercised once and answered a well-formed A2A 1.0 SendMessage response,
    so the card describes a surface that exists.'
  deviations:
  - field: url
    observed: absent at the top level
    note: A reader written against A2A 0.3.0 expects a top-level url and finds none; the endpoint is carried on
      supportedInterfaces[0].url. Recorded because both card shapes coexist in the wild, not because the card is
      out of spec.
  - field: securitySchemes / security
    observed: absent
    note: 'No security scheme is declared and none is required: the endpoint answered SendMessage anonymously. The
      card is silent rather than declaring an explicit no-auth posture.'
  - field: documentationUrl
    observed: absent
    note: The only human page describing the agent surfaces is https://moneyyoureowed.com/connect, which documents
      the MCP endpoint and does not mention the A2A card.
  - field: skills[0]
    observed: no inputModes/outputModes/securityRequirements on the skill
    note: The skill inherits the card defaults (text/plain or application/json in, application/json out). No inputSchema/outputSchema
      is published; the response shape is only observable by calling it.
  - field: JSON-RPC method names
    observed: SendMessage implemented; message/send returns -32601
    note: The server speaks the A2A 1.0 method vocabulary only. A 0.2/0.3 client using message/send will see Method
      not found even though the card is valid and the surface is live.
surface_relationship:
  note: 'The A2A agent and the MCP server (mcp/moneyyoureowed-com-mcp.yml) are two bindings of ONE read-only catalog:
    the A2A skill answer-money-questions and the MCP tool answer_money_question returned the same five source-cited
    facts and the same product pointer for the same question on the same day. There is no REST/OpenAPI contract
    behind either; the only other API-shaped path on the apex is the checkout starter site.js calls (/api/checkout-start),
    which robots.txt disallows and which is a Stripe checkout bootstrap, not a public API.'
