agent_card:
  name: Money You're Owed catalog agent
  description: Answers consumer questions about money owed (deposits, refunds, denied claims) with primary-sourced
    facts and points to self-help kits.
  version: 1.0.0
  protocol_version: '1.0'
  provider:
    organization: Money You're Owed
    url: https://moneyyoureowed.com
  supported_interfaces:
  - url: https://agent.moneyyoureowed.com
    protocol_binding: JSONRPC
    protocol_version: '1.0'
  capabilities:
    streaming: false
    pushNotifications: false
  default_input_modes:
  - text/plain
  - application/json
  default_output_modes:
  - application/json
  security_schemes: null
  skill_count: 1
  skills:
  - id: answer-money-questions
    name: Answer money-recovery questions
    description: Verified facts + product pointers. Read-only; no purchases.
    tags:
    - deposits
    - refunds
    - denied-claims
    - consumer-rights
    examples:
    - My landlord kept my security deposit. What can I do?
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: null
  transport: JSONRPC (via supportedInterfaces[0].protocolBinding)
  hard_checks:
