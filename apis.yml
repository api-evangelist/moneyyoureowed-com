apis:
- aid: moneyyoureowed-com:catalog-mcp-server
  name: Money You're Owed Catalog MCP Server
  description: 'Free public remote Model Context Protocol server (Streamable HTTP, protocol 2025-06-18, stateless,
    no authentication) exposing one read-only tool, answer_money_question, which takes a plain-language consumer
    money-recovery question and returns source-cited facts plus an optional pointer to one of the operator''s self-help
    kits. Documented for Claude and Gemini custom connectors on the /connect page. Probed live 2026-09-19: initialize,
    tools/list and tools/call all succeed anonymously.'
