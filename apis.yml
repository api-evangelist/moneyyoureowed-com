aid: moneyyoureowed-com
name: Money You're Owed
description: 'Money You''re Owed publishes plain-English US consumer money-recovery help — free official-route checklists
  (unclaimed property, airline refunds, EITC, medical bills, property tax) and one-time-purchase self-help kits
  such as Deposit Defender and DenialFix — and exposes its source-cited fact catalog to AI assistants through two
  free, anonymous, read-only agent surfaces: a remote MCP server at mcp.moneyyoureowed.com with a single answer_money_question
  tool, and an A2A 1.0 agent whose card is served from agent.moneyyoureowed.com. There is no REST API, SDK or developer
  program; the machine surface is agent-native by design.'
