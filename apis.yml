- aid: moneyyoureowed-com:catalog-a2a-agent
  name: Money You're Owed Catalog Agent (A2A)
  description: 'A2A 1.0 agent ("Money You''re Owed catalog agent", version 1.0.0) with a JSONRPC binding at https://agent.moneyyoureowed.com
    and one read-only skill, answer-money-questions, answering consumer questions about money owed (deposits, refunds,
    denied claims) with primary-sourced facts and product pointers. The agent card is served at /.well-known/agent-card.json
    (and byte-identically at the legacy /.well-known/agent.json) and grades conformant. Probed live 2026-09-19:
    the 1.0 method SendMessage answers anonymously; streaming, tasks and the pre-1.0 message/send are not implemented.'
